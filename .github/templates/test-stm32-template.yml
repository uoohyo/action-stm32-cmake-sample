name: Test STM32CubeCLT v{{VERSION}}

on:
  push:
    branches:
      - main
    paths:
      - 'f103c8t6_project/**'
      - '.github/workflows/test-stm32-v{{VERSION}}.yml'
      - '.github/templates/test-stm32-template.yml'
      - '.github/scripts/verify_output.py'
      - '.github/scripts/test_results.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [Debug, Release]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove previous configuration outputs
        run: rm -rf -- 'f103c8t6_project/build/${{ matrix.config }}'

      - name: Build with STM32CubeCLT v{{VERSION}} - ${{ matrix.config }}
        id: build
        uses: uoohyo/action-stm32-cmake@v{{VERSION}}
        continue-on-error: true
        with:
          project-path: 'f103c8t6_project'
          build-config: ${{ matrix.config }}
          build-target: 'all'
          cmake-args: '--preset ${{ matrix.config }}'

      - name: Verify Build Output
        id: verify
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          python3 .github/scripts/verify_output.py "$BUILD_OUTCOME" \
            'f103c8t6_project/build/${{ matrix.config }}' 'f103c8t6_project/build/${{ matrix.config }}/f103c8t6_project.elf' --elf
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Save Test Result
        if: always()
        env:
          RESULT_STATUS: ${{ steps.verify.outputs.status || 'failure' }}
        run: python3 .github/scripts/test_results.py save '{{VERSION}}' '${{ matrix.config }}' "$RESULT_STATUS"

      - name: Upload Test Result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-result-{{VERSION}}-${{ matrix.config }}-attempt-${{ github.run_attempt }}
          path: .github/test-results/{{VERSION}}-${{ matrix.config }}.json
          if-no-files-found: error
          retention-days: 90
