name: Update Test Results

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/test-results/**'
      - '.github/workflows/sync-test-results.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: update-readme-results
  cancel-in-progress: false

jobs:
  update-readme:
    name: Update README Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect run-bound configuration results
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/test_results.py collect stm32

      - name: Update README Table
        run: |
          chmod +x .github/scripts/update-readme-table.sh
          bash .github/scripts/update-readme-table.sh

      - name: Commit README Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md .github/test-results/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 update test results table [skip ci]"
            git push

            echo "✅ README updated successfully"
          fi

      - name: Fail on incomplete collection
        if: steps.collect.outputs.degraded != '0'
        run: |
          echo "::error::Some versions have missing or incompatible results. README marks these explicitly."
          exit 1
